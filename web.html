<script>
(function(){
var m=document.getElementById('m');
var s=(new URLSearchParams(location.search).get('s')||'').toLowerCase();
function fail(t){m.textContent=t}
if(!/^[a-z0-9-]{8,80}$/.test(s)){fail('Enlace no válido.');return}
var c=supabase.createClient('https://mlaqtniujnvfxcvcourm.supabase.co','sb_publishable_6no6BuOgiA_2nonTJntAuQ_DTqEgrcV',{auth:{persistSession:false,autoRefreshToken:false}});
c.rpc('oficina_web_publica',{p_slug:s}).then(function(r){
 if(r.error||!r.data||!r.data.datos){fail('Esta propuesta no está disponible.');return}
 var html=WMWeb.documento(r.data.datos,{base:encodeURI(new URL('./',location.href).href)});
 document.open();document.write(html);document.close();
}).catch(function(){fail('No se pudo cargar. Inténtalo de nuevo.')});
})();
</script>
